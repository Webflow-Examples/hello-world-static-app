    <title>404 · Page not found · Webflow Cloud (Static HTML)</title>
    <meta
      name="description"
      content="The page you're looking for could not be found on this static Webflow Cloud app."
    />
    <!--
      This 404 page is intentionally self-contained: the CSS, script, and favicon
      are inlined rather than linked. Webflow Cloud serves 404.html at the URL that
      was requested, so relative links (e.g. "styles.css") would resolve against
      that request path and break for nested misses like /foo/bar. Inlining keeps
      the page styled at any depth. Keep index.html on the shared styles.css.
    -->
    <style>
:root {
  --wf-bg: #06091c;
  --wf-bg-2: #0b1030;
  --wf-surface: rgba(255, 255, 255, 0.04);
  --wf-surface-hover: rgba(255, 255, 255, 0.08);
  --wf-border: rgba(255, 255, 255, 0.08);
  --wf-border-strong: rgba(255, 255, 255, 0.14);
  --wf-fg: #f5f7ff;
  --wf-fg-dim: #9aa2c7;
  --wf-fg-mute: #6c749a;
  --wf-blue: #146ef5;
  --wf-blue-2: #4353ff;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--wf-bg);
  color: var(--wf-fg);
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
}

a {
  color: inherit;
  text-decoration: none;
}

code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.9em;
  padding: 0.12em 0.4em;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--wf-border);
}

.wf-page {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(1200px 600px at 70% -10%, rgba(67, 83, 255, 0.18), transparent 60%),
    radial-gradient(900px 500px at 10% 10%, rgba(20, 110, 245, 0.12), transparent 55%),
    linear-gradient(180deg, var(--wf-bg) 0%, var(--wf-bg-2) 100%);
  overflow: hidden;
}

.wf-glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(600px 300px at 50% 0%, rgba(67, 83, 255, 0.22), transparent 70%);
  filter: blur(10px);
  z-index: 0;
}

.wf-header,
.wf-main,
.wf-footer {
  position: relative;
  z-index: 1;
}

.wf-header {
  max-width: 1120px;
  margin: 0 auto;
  width: 100%;
  padding: 28px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.wf-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.wf-brand-text {
  font-weight: 600;
  letter-spacing: -0.01em;
  font-size: 15px;
}
.wf-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
}
.wf-nav a {
  padding: 8px 14px;
  border-radius: 999px;
  color: var(--wf-fg-dim);
  transition: color 0.15s, background 0.15s;
}
.wf-nav a:hover {
  color: var(--wf-fg);
  background: var(--wf-surface);
}
.wf-nav-ghost {
  border: 1px solid var(--wf-border);
}

.wf-main {
  max-width: 1120px;
  margin: 0 auto;
  width: 100%;
  padding: 48px 32px 80px;
  flex: 1;
}
.wf-hero {
  text-align: center;
  padding: 56px 0 64px;
}

.wf-eyebrow {
  display: inline-block;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--wf-fg-dim);
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--wf-surface);
  border: 1px solid var(--wf-border);
  margin: 0 0 28px;
}

.wf-title {
  font-size: clamp(36px, 6vw, 64px);
  line-height: 1.04;
  font-weight: 700;
  letter-spacing: -0.03em;
  margin: 0 0 20px;
}
.wf-gradient {
  background: linear-gradient(90deg, #6c8dff 0%, #146ef5 50%, #9b7dff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.wf-subtitle {
  font-size: 17px;
  line-height: 1.55;
  color: var(--wf-fg-dim);
  max-width: 560px;
  margin: 0 auto 32px;
}

.wf-cta {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

.wf-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 20px;
  border-radius: 10px;
  font-weight: 500;
  font-size: 14px;
  transition: transform 0.1s, background 0.15s, border-color 0.15s, box-shadow 0.15s;
  border: 1px solid transparent;
  cursor: pointer;
}
.wf-btn-primary {
  background: var(--wf-blue);
  color: #fff;
  box-shadow: 0 6px 24px -8px rgba(20, 110, 245, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.16);
}
.wf-btn-primary:hover {
  background: #2a7ef8;
  transform: translateY(-1px);
}
.wf-btn-ghost {
  color: var(--wf-fg);
  border-color: var(--wf-border-strong);
  background: var(--wf-surface);
}
.wf-btn-ghost:hover {
  background: var(--wf-surface-hover);
  border-color: rgba(255, 255, 255, 0.22);
}

.wf-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
  margin-top: 8px;
}
.wf-card {
  position: relative;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 22px 22px;
  background: var(--wf-surface);
  border: 1px solid var(--wf-border);
  border-radius: 14px;
  transition: border-color 0.15s, background 0.15s, transform 0.15s;
  color: var(--wf-fg);
}
.wf-card:hover {
  border-color: rgba(20, 110, 245, 0.5);
  background: var(--wf-surface-hover);
  transform: translateY(-1px);
}
.wf-card-body {
  flex: 1;
}
.wf-card-title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0 0 6px;
}
.wf-card-desc {
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--wf-fg-dim);
  margin: 0;
}
.wf-card-arrow {
  color: var(--wf-fg-mute);
  transition: color 0.15s, transform 0.15s;
}
.wf-card:hover .wf-card-arrow {
  color: var(--wf-blue);
  transform: translate(2px, -2px);
}

.wf-footer {
  max-width: 1120px;
  margin: 0 auto;
  width: 100%;
  padding: 28px 32px 40px;
  font-size: 13px;
  color: var(--wf-fg-mute);
  display: flex;
  justify-content: center;
  text-align: center;
  border-top: 1px solid var(--wf-border);
}
.wf-footer a {
  color: var(--wf-fg-dim);
}
.wf-footer a:hover {
  color: var(--wf-blue);
}

@media (max-width: 640px) {
  .wf-header {
    padding: 20px;
  }
  .wf-main {
    padding: 24px 20px 48px;
  }
  .wf-hero {
    padding: 24px 0 40px;
  }
}

    </style>
  </head>
  <body>
    <div class="wf-page">
      <div class="wf-glow" aria-hidden="true"></div>

      <header class="wf-header">
        <div class="wf-brand">
          <svg
            width="28"
            height="20"
            viewBox="0 0 40 28"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-label="Webflow"
            role="img"
          >
            <path
              d="M40 0L25.95 27.6H12.75L18.6 16.2H18.35C13.5 22.55 6.3 26.75 0 27.6V16.35C0 16.35 3.95 16.1 6.3 13.65H0V0.005H11.25V9.3L11.5 9.3L16.05 0H24.55L23.65 8.15L25.2 8.15L29.25 0H40Z"
              fill="url(#wf-mark)"
            />
            <defs>
              <linearGradient id="wf-mark" x1="0" y1="0" x2="40" y2="28" gradientUnits="userSpaceOnUse">
                <stop stop-color="#4353FF" />
                <stop offset="1" stop-color="#146EF5" />
              </linearGradient>
            </defs>
          </svg>
          <span class="wf-brand-text">Webflow Cloud</span>
        </div>
        <nav class="wf-nav">
          <a href="https://developers.webflow.com/webflow-cloud" target="_blank" rel="noreferrer">Docs</a>
          <a href="https://github.com/Webflow-Examples" target="_blank" rel="noreferrer" class="wf-nav-ghost">GitHub</a>
        </nav>
      </header>

      <main class="wf-main">
        <section class="wf-hero">
          <p class="wf-eyebrow">Error 404</p>
          <h1 class="wf-title">
            This page <span class="wf-gradient">does not exist</span>
          </h1>
          <p class="wf-subtitle">
            We couldn't find the page you're looking for. Check the URL, or head back to the
            homepage.
          </p>
          <div class="wf-cta">
            <a class="wf-btn wf-btn-primary" href="/">Back to home</a>
            <a
              class="wf-btn wf-btn-ghost"
              href="https://developers.webflow.com/webflow-cloud"
              target="_blank"
              rel="noreferrer"
            >
              Read the docs
            </a>
          </div>
        </section>
      </main>

      <footer class="wf-footer">
        <span>
          Built with static HTML · Deployed on
          <a href="https://webflow.com/cloud" target="_blank" rel="noreferrer">Webflow Cloud</a>
          · <span id="wf-year"></span>
        </span>
      </footer>
    </div>

    <script>
// Minimal progressive enhancement — no framework, no build step.
// Everything here is optional; the page is fully readable without JS.
const yearEl = document.getElementById("wf-year");
if (yearEl) {
  yearEl.textContent = String(new Date().getFullYear());
}
    </script>
  </body>
</html>
